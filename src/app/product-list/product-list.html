<h1>Our Products</h1>

<div>
  <h2>{{ products[0].name }}</h2>
  <p>Price: {{ products[0].price }}</p>
  <img [src]="products[0].imageurl" width="150">
  <button
    [disabled]="!products[0].available"
    (click)="buyProduct(products[0].name)">
    Buy Now
  </button>
</div>
